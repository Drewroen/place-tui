# fly.toml app configuration file generated for place-tui on 2026-10-23T16:53:34-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'place-tui'
primary_region = 'sjc'

[build]
[env]
  HOST = '0.0.0.0'
  PORT = '8090'
  WORLD_STATE_FILE = '/data/world.bin'

[[mounts]]
  source = 'place_data'
  destination = '/data'

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
