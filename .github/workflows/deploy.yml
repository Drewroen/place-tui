name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # Only deploy when the Fly token secret exists, so pushes don't fail before
  # the app is set up. See DEPLOY.md.
  check:
    name: Check for FLY_API_TOKEN
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "FLY_API_TOKEN is set — deploying."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_API_TOKEN is not set; skipping deploy. See DEPLOY.md."
          fi

  deploy:
    name: Deploy to Fly.io
    needs: check
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
