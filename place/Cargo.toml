[package]
name = "place-tui"
version = "0.0.5"
edition = "2021"
description = "Terminal client for a shared place / world map server"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Drewroen/place-tui"
homepage = "https://github.com/Drewroen/place-tui"
keywords = ["tui", "terminal", "multiplayer", "websocket", "game"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "place"
path = "src/main.rs"

[dependencies]
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# tungstenite enables rustls without a crypto provider; use ring explicitly so
# wss:// works (and avoid the OpenSSL dependency that native-tls needed).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
crossterm = "0.28"

# Used to notice that the terminal hung up. crossterm 0.28 spins forever on a
# hung-up pty (EOF looks readable), so we watch for POLLHUP ourselves.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
