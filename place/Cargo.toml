[package]
name = "place"
version = "0.2.0"
edition = "2021"
description = "Terminal client for a shared place / world map server"
license = "MIT"
readme = "README.md"

[[bin]]
name = "place"
path = "src/main.rs"

[dependencies]
tungstenite = { version = "0.24", features = ["native-tls"] }
serde_json = "1"
crossterm = "0.28"

[profile.release]
strip = true
lto = true
