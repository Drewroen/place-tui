<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>place — the wild west</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5.3.0/400.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5.3.0/600.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5.3.0/700.css" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body {
      margin: 0; overflow: hidden; background: #0d0d10; color: #ddd;
      font: 14px/1.5 'Iosevka', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #map {
      position: fixed; inset: 0; display: block;
      width: 100vw; height: 100vh;
      background: #e5e5e5; image-rendering: pixelated;
      cursor: grab;
      touch-action: none;           /* gestures on the map are ours, not the browser's */
      -webkit-user-select: none; user-select: none;
    }
    #map.dragging { cursor: grabbing; }

    header, footer {
      position: fixed; left: 0; right: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      flex-wrap: wrap; gap: 8px;
      padding: 9px 14px;
      background: rgba(13, 13, 16, .74);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    header { top: 0; border-bottom: 1px solid rgba(255, 255, 255, .08); }
    footer {
      bottom: 0; border-top: 1px solid rgba(255, 255, 255, .08);
      color: #888; font-size: 13px;
    }
    h1 { margin: 0; font-size: 16px; letter-spacing: .5px; }
    footer b { color: #ddd; font-weight: 600; }
    footer a { color: #9ab; }
    #play {
      background: none; border: 0; padding: 0; margin: 0;
      color: #9ab; font: inherit; cursor: pointer;
    }
    #play:hover { color: #cde; text-decoration: underline; }
    #status.live { color: #6ec06e; }
    #status.down { color: #e06c6c; }

    dialog {
      position: relative; box-sizing: border-box;
      width: min(92vw, 540px); max-height: min(86vh, 640px); overflow: auto;
      border: 1px solid #3a3a42; border-radius: 10px;
      padding: 24px; background: #16161a; color: #ddd;
      box-shadow: 0 20px 80px rgba(0, 0, 0, .65);
    }
    dialog::backdrop {
      background: rgba(0, 0, 0, .68);
      -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    }
    dialog h2 { margin: 0 0 10px; font-size: 20px; }
    dialog p { margin: 10px 0; color: #aaa; }
    dialog code {
      background: #0d0d10; border-radius: 4px; padding: 2px 5px; color: #ddd;
    }
    dialog pre {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      background: #0d0d10; border: 1px solid #333; border-radius: 6px;
      padding: 10px 12px; margin: 12px 0;
    }
    dialog pre code { background: none; padding: 0; }
    dialog a { color: #9ab; }
    #close-play {
      position: absolute; top: 10px; right: 12px;
      background: none; border: 0; color: #888; font-size: 22px;
      line-height: 1; cursor: pointer;
    }
    #close-play:hover { color: #ddd; }
    #copy {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; flex: none;
      background: #24242b; color: #ddd; border: 1px solid #3a3a42;
      border-radius: 4px; cursor: pointer; font: inherit;
    }
    #copy:hover { background: #2e2e36; }
    #copy svg { display: block; }
    #copy.copied svg { display: none; }
    #copy.copied::after { content: '✓'; color: #6ec06e; }

    @media (max-width: 620px) {
      header, footer { padding: 7px 10px; }
      h1 { font-size: 14px; }
      dialog { padding: 18px; }
    }
  </style>
</head>
<body>
  <canvas id="map" width="1024" height="1024"></canvas>

  <header>
    <h1>place — the wild west</h1>
  </header>

  <footer>
    <b id="status">connecting…</b>
    <span>·</span>
    <span id="count"></span>
    <span>·</span>
    <button id="play" type="button">play now</button>
  </footer>

  <dialog id="play-modal">
    <form method="dialog">
      <button id="close-play" type="submit" aria-label="Close">×</button>
    </form>
    <h2>play in your terminal</h2>
    <pre><code id="install-command">cargo install place-tui && place</code><button id="copy" type="button" aria-label="Copy install command" title="Copy install command"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="8" height="9" rx="1.4"></rect><path d="M3 11V3.5A1.5 1.5 0 0 1 4.5 2H10"></path></svg></button></pre>
    <p>
      <a href="https://crates.io/crates/place-tui" target="_blank" rel="noopener">view on crates.io</a>
    </p>
  </dialog>

  <script src="viewer.js?v=9"></script>
</body>
</html>
