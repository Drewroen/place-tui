<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>place — the wild west</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body {
      margin: 0; overflow: hidden; background: #0d0d10; color: #ddd;
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #map {
      position: fixed; inset: 0; display: block;
      width: 100vw; height: 100vh;
      background: #e5e5e5; image-rendering: pixelated;
      cursor: grab;
      touch-action: none;           /* gestures on the map are ours, not the browser's */
      -webkit-user-select: none; user-select: none;
    }
    #map.dragging { cursor: grabbing; }

    header, footer {
      position: fixed; left: 0; right: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      flex-wrap: wrap; gap: 8px;
      padding: 9px 14px;
      background: rgba(13, 13, 16, .74);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    header { top: 0; border-bottom: 1px solid rgba(255, 255, 255, .08); }
    footer {
      bottom: 0; border-top: 1px solid rgba(255, 255, 255, .08);
      color: #888; font-size: 13px;
    }
    h1 { margin: 0; font-size: 16px; letter-spacing: .5px; }
    footer b { color: #ddd; font-weight: 600; }
    footer a { color: #9ab; }
    .hint { color: #666; border-left: 1px solid #333; padding-left: 8px; }
    #install { display: inline-block; }
    #install summary { cursor: pointer; color: #9ab; list-style: none; }
    #install summary::marker, #install summary::-webkit-details-marker { display: none; }
    #install summary:hover { color: #cde; }
    #install summary code { color: #ddd; }
    #install code {
      display: inline-block; background: #0d0d10; padding: 5px 8px;
      border-radius: 4px; margin: 6px 6px 0 0;
    }
    #copy {
      background: #24242b; color: #ddd; border: 1px solid #3a3a42;
      border-radius: 4px; padding: 3px 10px; cursor: pointer; font: inherit;
    }
    #copy:hover { background: #2e2e36; }
    #status.live { color: #6ec06e; }
    #status.down { color: #e06c6c; }

    @media (max-width: 620px) {
      header, footer { padding: 7px 10px; }
      h1 { font-size: 14px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="map" width="1024" height="1024"></canvas>

  <header>
    <h1>place — the wild west</h1>
  </header>

  <footer>
    <b id="status">connecting…</b>
    <span>·</span>
    <span id="count"></span>
    <span class="hint">drag to pan · scroll to zoom</span>
    <details id="install">
      <summary>install <code>place</code> ↵</summary>
      <code>cargo install place-tui</code><button id="copy" type="button">copy</button>
    </details>
    <a href="https://crates.io/crates/place-tui" target="_blank" rel="noopener">crates.io</a>
  </footer>

  <script src="viewer.js?v=6"></script>
</body>
</html>
